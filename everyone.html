<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pick 5 — everyone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="everyone">
<main>
  <header class="top">
    <div>
      <h1>2026 Pick 5 For Charity</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <nav class="tabs" aria-label="pages">
      <a href="index.html">Friends</a>
      <a href="everyone.html" aria-current="page">Everyone</a>
    </nav>
  </header>
  <div id="error" class="err" hidden></div>

  <section class="card">
    <h2>Season</h2>
    <div class="bar">
      <input id="q" type="search" placeholder="Find an entrant" aria-label="Find an entrant">
      <button id="friendsOnly" type="button" aria-pressed="false">Friends only</button>
      <span class="meta" id="count"></span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="wrap"><table id="season"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <h2 id="weekTitle">Week</h2>
    <div class="bar" id="weekTabs"></div>
    <details><summary>Most-picked teams this week</summary><ul class="pop" id="pop"></ul></details>
    <div class="wrap" style="margin-top:10px"><table id="board"><thead><tr><th>#</th><th>Entrant</th><th class="num">Pts</th><th>Picks</th></tr></thead><tbody></tbody></table></div>
  </section>

  <p class="note" id="note"></p>
</main>

<script src="app.js"></script>
</body>
</html>
