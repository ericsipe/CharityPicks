<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pick 5 — friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* friends board: only five rows, so always show the score next to each pick */
  .pick .d { display: inline; }
  .picks { gap: 6px 10px; }
</style>
</head>
<body data-mode="friends">
<main>
  <header class="top">
    <div>
      <h1>2026 Pick 5 For Charity</h1>
      <div class="sub"><span id="updated">Loading…</span> · <button id="refresh" type="button">Refresh</button></div>
    </div>
    <nav class="tabs" aria-label="pages">
      <a href="index.html" aria-current="page">Friends</a>
      <a href="everyone.html">Everyone</a>
    </nav>
  </header>
  <div id="error" class="err" hidden></div>

  <section class="card">
    <h2>Season</h2>
    <div class="legend" id="legend"></div>
    <div class="wrap"><table id="season"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <h2 id="weekTitle">Week</h2>
    <div class="bar" id="weekTabs"></div>
    <div class="wrap"><table id="board"><thead><tr><th>#</th><th>Entrant</th><th class="num">Pts</th><th>Picks</th></tr></thead><tbody></tbody></table></div>
  </section>

  <p class="note" id="note"></p>
</main>
<script src="app.js"></script>
</body>
</html>
